[package]
name = "baogui-android"
version = "0.1.0"
edition = "2021"
description = "BaoGUI — OpenBao client for Android (NativeActivity + shared UI lib)"
license = "MIT"
publish = false

# Own workspace root so cargo-apk builds in-tree.
[workspace]
members = ["."]

[lib]
name = "baogui_android"
path = "src/lib.rs"
# lib-only: cargo-apk panics if this package also has [[bin]] targets
crate-type = ["cdylib", "rlib"]

[dependencies]
baogui = { path = ".." }
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "android-native-activity",
] }
android_logger = "0.14"
log = "0.4"
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }

[package.metadata.android]
package = "org.openbao.baogui"
apk_name = "baogui"
  build_targets = ["aarch64-linux-android", "x86_64-linux-android"]

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 34

[package.metadata.android.application]
label = "BaoGUI"
orientations = ["Portrait", "Landscape"]
# HTTP OpenBao servers + localhost OIDC callback (http://localhost:8250/…).
uses_cleartext_traffic = true
