# Build distributable APK on nixbuild.net.
# APK: nix build .#android → baogui.apk
#
# NIXBUILD_TOKEN is fetched from OpenBao (secret/data/ai-api-keys). Falls back to
# the repository secret nixbuild_token when OPENBAO_TOKEN is unset.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK (android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch nixbuild token
        env:
          OPENBAO_ADDR: https://openbao.boxd.sh
          OPENBAO_TOKEN: ${{ secrets.OPENBAO_TOKEN }}
          OPENBAO_SECRET_PATH: secret/data/ai-api-keys
        run: |
          set -euo pipefail
          if [[ -n "${OPENBAO_TOKEN:-}" ]]; then
            chmod +x scripts/fetch-openbao-env.sh
            ./scripts/fetch-openbao-env.sh --github-env --keys NIXBUILD_TOKEN
          elif [[ -n "${{ secrets.nixbuild_token }}" ]]; then
            {
              echo "NIXBUILD_TOKEN<<EOF"
              echo "${{ secrets.nixbuild_token }}"
              echo "EOF"
            } >>"$GITHUB_ENV"
          else
            echo "Set OPENBAO_TOKEN (preferred) or nixbuild_token repository secret" >&2
            exit 1
          fi

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_conf: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      - uses: nixbuild/nixbuild-action@v25
        with:
          nixbuild_token: ${{ env.NIXBUILD_TOKEN }}
          generate_summary_for: job

      - name: nix build .#android
        run: nix build ".#android" -L --print-build-logs --out-link result-android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baogui-apk
          path: result-android/baogui.apk
          if-no-files-found: error

  smoke:
    name: APK smoke (smoke.boxd)
    needs: [apk]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Fetch smoke SSH key
        env:
          OPENBAO_ADDR: https://openbao.boxd.sh
          OPENBAO_TOKEN: ${{ secrets.OPENBAO_TOKEN }}
          OPENBAO_SECRET_PATH: secret/data/ai-api-keys
        run: |
          set -euo pipefail
          if [[ -z "${OPENBAO_TOKEN:-}" ]]; then
            echo "OPENBAO_TOKEN unset — skip remote smoke (provision smoke.boxd + secret first)" >&2
            exit 0
          fi
          chmod +x scripts/fetch-openbao-env.sh
          ./scripts/fetch-openbao-env.sh --github-env --keys SMOKE_SSH_KEY,SMOKE_HOST || {
            echo "SMOKE_SSH_KEY not in OpenBao — skip remote smoke" >&2
            exit 0
          }

      - uses: actions/download-artifact@v4
        with:
          name: baogui-apk
          path: artifact

      - name: Remote smoke on smoke.boxd
        if: env.SMOKE_SSH_KEY != ''
        env:
          SMOKE_HOST: ${{ env.SMOKE_HOST || 'smoke.boxd.sh' }}
          SMOKE_USER: smoke
        run: |
          set -euo pipefail
          install -m 600 /dev/stdin ~/.ssh/id_smoke <<<"$SMOKE_SSH_KEY"
          apk="$(find artifact -name '*.apk' | head -1)"
          [[ -f "$apk" ]]
          scp -i ~/.ssh/id_smoke -o StrictHostKeyChecking=accept-new "$apk" \
            "$SMOKE_USER@$SMOKE_HOST:~/baogui-smoke.apk"
          ssh -i ~/.ssh/id_smoke "$SMOKE_USER@$SMOKE_HOST" \
            'cd ~/baogui && git pull --ff-only && ./scripts/apk-smoke.sh --ci ~/baogui-smoke.apk'

  ci:
    name: CI
    if: always()
    needs: [apk, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require APK build
        run: |
          set -euo pipefail
          apk="${{ needs.apk.result }}"
          echo "apk=$apk"
          [[ "$apk" == success ]]
          smoke="${{ needs.smoke.result }}"
          echo "smoke=$smoke"
          [[ "$smoke" == "success" || "$smoke" == "skipped" ]]

