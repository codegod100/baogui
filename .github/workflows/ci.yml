# CI: host checks + Nix APK build on GitHub Actions (no nixbuild.net).
# APK: nix build .#android → baogui.apk → workflow artifact + summary link.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone vidya
        run: git clone --depth 1 https://tangled.org/nandi.uk/vidya ../vidya

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"

      - name: Install egui system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev pkg-config

      - name: cargo clippy
        run: cargo clippy -- -D warnings

      - name: cargo test
        run: cargo test

  apk:
    name: APK (android)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_conf: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      - name: nix build .#android
        run: nix build ".#android" -L --print-build-logs --out-link result-android

      - name: Upload APK
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: baogui-apk
          path: result-android/baogui.apk
          if-no-files-found: error

      - name: APK summary
        run: |
          version="$(grep '^version' android/Cargo.toml | head -1 | cut -d'"' -f2)"
          {
            echo "## APK"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`$version\` |"
            echo "| Workflow artifact | [baogui.apk](${{ steps.upload-apk.outputs.artifact-url }}) |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >>"$GITHUB_STEP_SUMMARY"

  smoke:
    name: APK smoke (smoke.boxd)
    needs: [apk]
    runs-on: ubuntu-latest
    if: >-
      needs.apk.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    steps:
      - name: Install boxd CLI
        run: curl -fsSL https://boxd.sh/downloads/install.sh | sh

      - name: Fetch boxd token from OpenBao
        env:
          OPENBAO_ADDR: https://openbao.boxd.sh
          OPENBAO_TOKEN: ${{ secrets.OPENBAO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENBAO_TOKEN:-}" ]]; then
            echo "OPENBAO_TOKEN unset — skip remote smoke" >&2
            exit 0
          fi
          chmod +x scripts/boxd-env.sh scripts/fetch-openbao-env.sh
          ./scripts/boxd-env.sh --github-env || {
            echo "BOXD_API_KEY not in OpenBao — skip remote smoke" >&2
            exit 0
          }

      - uses: actions/download-artifact@v4
        with:
          name: baogui-apk
          path: artifact

      - name: Remote smoke on smoke.boxd
        if: env.BOXD_TOKEN != ''
        env:
          BOXD_SMOKE_NAME: smoke
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          apk="$(find artifact -name '*.apk' | head -1)"
          [[ -f "$apk" ]]
          boxd machine resume "$BOXD_SMOKE_NAME" 2>/dev/null || true
          boxd machine cp "$apk" "$BOXD_SMOKE_NAME:/tmp/smoke/baogui.apk"
          boxd machine exec "$BOXD_SMOKE_NAME" -- bash -lc \
            'cd /opt/baogui && git pull --ff-only && ./scripts/apk-smoke.sh --ci /tmp/smoke/baogui.apk'

  ci:
    name: CI
    if: always()
    needs: [check, apk, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require checks
        run: |
          set -euo pipefail
          check="${{ needs.check.result }}"
          echo "check=$check"
          [[ "$check" == success ]]
          apk="${{ needs.apk.result }}"
          echo "apk=$apk"
          [[ "$apk" == success ]]
          smoke="${{ needs.smoke.result }}"
          echo "smoke=$smoke"
          [[ "$smoke" == "success" || "$smoke" == "skipped" ]]
