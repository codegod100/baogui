# Buildkite CI for Radicle Garden (buildkite-adapter).
# Mirrors .github/workflows/ci.yml "check" + optional nixbuild APK,
# plus Flatpak desktop/Wayland bundle (org.openbao.baogui.flatpak).
#
# Artifacts:
#   - Flatpak: flatpak-builder in privileged Docker → org.openbao.baogui.flatpak
#   - APK: nix build .#android on nixbuild.net (ssh-ng:// → eu.nixbuild.net)
#   - Nix desktop package .#baogui is also built on nixbuild (verify only;
#     Flatpak remains the desktop download — no naked ELF upload)
# Do NOT upload a naked cargo release binary (NoWaylandLib on plain Linux).
#
# Secrets (Buildkite cluster → Secrets, org nandi / Default cluster):
#   - NIXBUILD_TOKEN (preferred for nix builds) — soft-loaded via
#     buildkite-agent secret get; never printed. Required for APK / nix package.
#   - OPENBAO_TOKEN (optional) — if set, scripts/fetch-openbao-env.sh reads
#     secret/data/ai-api-keys → NIXBUILD_TOKEN (same as GitHub Actions)
# UI: https://buildkite.com/organizations/nandi/clusters → Default cluster → Secrets
# Pipeline: https://buildkite.com/nandi/baogui-aopjch
#
# Nix+nixbuild setup: scripts/ci-nixbuild.sh (mirrors nixbuild-action:
# trusted-public-keys, ssh://nixbuild substituter, builders-use-substitutes,
# remote-store builds per https://docs.nixbuild.net/remote-builds/).
#
# Agents must reach https://nandi.radicle.garden/{rid}.git and
# https://tangled.org/nandi.uk/vidya, plus Flathub for Flatpak SDK/runtime.
# Author email must match a verified Buildkite personal email (or GitHub-linked noreply).
# Hosted queue key: auto (LINUX_AMD64_2X4).
# Use $$ so Buildkite does not interpolate shell vars at pipeline-upload time.

agents:
  queue: auto

env:
  RUST_BACKTRACE: "1"

steps:
  - label: ":rust: Check"
    key: check
    command: |
      set -euo pipefail

      # Path dep: vidya lives next to this checkout.
      vidya_dir="$$(dirname "$$PWD")/vidya"
      if [[ ! -d "$$vidya_dir/.git" && ! -f "$$vidya_dir/Cargo.toml" ]]; then
        git clone --depth 1 https://tangled.org/nandi.uk/vidya "$$vidya_dir"
      fi

      if ! command -v rustup >/dev/null 2>&1; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
          | sh -s -- -y --default-toolchain 1.85
        # shellcheck disable=SC1091
        source "$$HOME/.cargo/env"
      fi
      rustup toolchain install 1.85 --profile minimal --component clippy
      rustup default 1.85

      if command -v apt-get >/dev/null 2>&1; then
        sudo apt-get update
        sudo apt-get install -y \
          libxkbcommon-dev libxkbcommon-x11-dev \
          libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
          libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev pkg-config
      fi

      cargo clippy -- -D warnings
      cargo test

  - label: ":package: Flatpak"
    key: flatpak
    depends_on: check
    timeout_in_minutes: 120
    command: |
      set -euo pipefail

      vidya_dir="$$(dirname "$$PWD")/vidya"
      if [[ ! -f "$$vidya_dir/Cargo.toml" ]]; then
        git clone --depth 1 https://tangled.org/nandi.uk/vidya "$$vidya_dir"
      fi

      chmod +x scripts/flatpak.sh

      # Hosted agents: flatpak-builder's bubblewrap fails with
      #   bwrap: pivot_root: Operation not permitted
      # (user namespaces / nested sandbox blocked). Same fix as Flathub GHA:
      # build inside a privileged Freedesktop flatpak image. Mount baogui at
      # /baogui and sibling vidya at /vidya so manifest path ../../vidya works.
      command -v docker >/dev/null 2>&1 || {
        echo "docker required for Flatpak CI (host bwrap cannot pivot_root)" >&2
        exit 1
      }

      image=ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      echo "--- :docker: pull $$image"
      docker pull "$$image"

      echo "--- :package: flatpak-builder org.openbao.baogui (privileged container)"
      docker run --rm --privileged \
        --volume "$$PWD:/baogui:rw" \
        --volume "$$vidya_dir:/vidya:rw" \
        --workdir /baogui \
        "$$image" \
        bash -lc 'set -euo pipefail
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          ./scripts/flatpak.sh build
        '

      # Container may create root-owned artifacts; agent upload needs readable files.
      sudo chown -R "$$(id -u):$$(id -g)" org.openbao.baogui.flatpak flatpak-build flatpak-repo .flatpak-builder 2>/dev/null || true

      [[ -f org.openbao.baogui.flatpak ]] || {
        echo "Flatpak bundle missing" >&2
        ls -la >&2 || true
        exit 1
      }

      buildkite-agent artifact upload org.openbao.baogui.flatpak

  - label: ":android: APK + nix (nixbuild.net)"
    key: apk
    depends_on: check
    timeout_in_minutes: 120
    # Prefer soft get (missing secret → skip) over YAML `secrets:` (missing key fails the job).
    command: |
      set -euo pipefail

      chmod +x scripts/ci-nixbuild.sh scripts/fetch-openbao-env.sh

      creds_out="$$(mktemp)"
      ./scripts/ci-nixbuild.sh resolve-creds | tee "$$creds_out"
      # shellcheck disable=SC1090
      eval "$$(grep -E '^(SKIP|NIXBUILD_CREDS_ENV)=' "$$creds_out")"
      if [[ "$${SKIP:-1}" == "1" ]]; then
        echo "--- :warning: Skipping nixbuild jobs (no nixbuild credentials)"
        echo "Desktop Flatpak is built in the Flatpak step (org.openbao.baogui.flatpak)."
        exit 0
      fi
      # shellcheck disable=SC1090
      source "$$NIXBUILD_CREDS_ENV"

      setup_out="$$(mktemp)"
      ./scripts/ci-nixbuild.sh setup | tee "$$setup_out"
      setup_env="$$(sed -n 's/^NIXBUILD_SETUP_ENV=//p' "$$setup_out" | tail -1)"
      [[ -n "$$setup_env" && -f "$$setup_env" ]] || {
        echo "ci-nixbuild setup did not emit NIXBUILD_SETUP_ENV" >&2
        exit 1
      }
      # shellcheck disable=SC1090
      source "$$setup_env"

      # APK artifact (same as GHA nix build .#android after nixbuild-action).
      ./scripts/ci-nixbuild.sh remote-build ".#android" result-android
      [[ -f result-android/baogui.apk ]] || {
        echo "APK missing under result-android/" >&2
        ls -la result-android >&2 || true
        exit 1
      }
      buildkite-agent artifact upload result-android/baogui.apk

      # Optional: verify flake desktop package on nixbuild (no ELF upload).
      echo "--- :nix: verify .#baogui on nixbuild"
      ./scripts/ci-nixbuild.sh remote-build ".#baogui" result-baogui
      [[ -x result-baogui/bin/baogui ]] || {
        echo "nix package missing bin/baogui" >&2
        ls -la result-baogui >&2 || true
        exit 1
      }
      echo "nix package .#baogui OK (not uploaded; use Flatpak for desktop artifact)"
