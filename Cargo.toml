[package]
name = "baogui"
version = "0.1.0"
edition = "2021"
description = "Simple Vidya (egui) client for OpenBao"
license = "MIT"
publish = false

[lib]
name = "baogui"
path = "src/lib.rs"

[[bin]]
name = "baogui"
path = "src/main.rs"

[dependencies]
vidya = { path = "../vidya" }
# Platform backends are target-gated so the same lib builds for Android (cargo-apk).
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
] }

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
